<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>選擇困難救星 ✨</title>
<style>
:root{font-family:system-ui,-apple-system,'Noto Sans TC',sans-serif;color:#47435b;background:#faf7ff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 10% 10%,#ffe8ee 0,transparent 34%),radial-gradient(circle at 90% 20%,#e2f5ff 0,transparent 32%),#faf7ff;min-height:100vh}.wrap{max-width:1050px;margin:auto;padding:32px 18px 60px}header{text-align:center;margin-bottom:24px}h1{font-size:clamp(29px,5vw,43px);margin:4px 0 8px}header p{color:#77718a;margin:0}.pill{display:inline-block;background:#fff;border:1px solid #eee2fa;border-radius:99px;padding:6px 15px;color:#9470ac;font-size:13px}.layout{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(290px,.95fr);gap:20px}.panel{background:#ffffffd9;border:1px solid #fff;box-shadow:0 12px 35px #9d8db51a;border-radius:25px;padding:24px}.wheel-panel{text-align:center}.wheel-box{width:min(100%,430px);aspect-ratio:1;margin:10px auto 18px;position:relative;filter:drop-shadow(0 12px 13px #76628b25)}canvas{width:100%;height:100%;display:block}.pointer{position:absolute;top:-9px;left:50%;transform:translateX(-50%);z-index:2;width:0;height:0;border-left:17px solid transparent;border-right:17px solid transparent;border-top:34px solid #625777;filter:drop-shadow(0 2px 2px #5553)}.center{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);height:66px;width:66px;background:#fff;border:7px solid #fff8;border-radius:50%;display:grid;place-items:center;font-size:26px;box-shadow:0 2px 12px #6d597733}.button{border:0;border-radius:15px;padding:13px 20px;font-size:16px;font-weight:750;cursor:pointer;transition:transform .15s,opacity .15s}.button:hover:not(:disabled){transform:translateY(-2px)}.button:disabled{opacity:.48;cursor:not-allowed}.primary{background:#a78bdb;color:white;box-shadow:0 5px 12px #b9a1e455}.secondary{background:#f3eafa;color:#795c9b}.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.result{margin-top:16px;min-height:72px;padding:15px;background:#f9f4ff;border-radius:17px}.result strong{font-size:23px;color:#7956aa}.muted{color:#898399;font-size:13px}h2{font-size:19px;margin:0 0 15px}.option-row{display:grid;grid-template-columns:1fr 75px 35px;gap:8px;align-items:center;margin-bottom:9px}.option-row input{width:100%;min-width:0;padding:11px;border:1px solid #e6dfef;border-radius:12px;font-size:15px;background:#fff;color:#514b65}.option-row input:focus{outline:2px solid #d8c3f3}.option-row button{height:39px;border:0;border-radius:11px;background:#fff0f0;color:#d77e89;font-size:19px;cursor:pointer}.label-row{display:grid;grid-template-columns:1fr 75px 35px;gap:8px;margin:0 0 7px;color:#8d869a;font-size:12px}.helper{font-size:13px;color:#898399;margin:10px 0}.add{width:100%;margin-top:8px}.history{margin-top:18px}.history-list{list-style:none;padding:0;margin:0}.history-list li{display:flex;justify-content:space-between;gap:12px;padding:11px 3px;border-bottom:1px solid #f1edf5;font-size:14px}.history-list small{color:#9b94a8;white-space:nowrap}.foot{text-align:center;margin-top:20px;color:#aaa1b5;font-size:12px}.toast{min-height:18px;color:#c36b78;font-size:13px;margin-top:7px}@media(max-width:760px){.layout{grid-template-columns:1fr}.panel{padding:19px}.wrap{padding-top:24px}.wheel-box{width:min(100%,390px)}}@media(prefers-reduced-motion:reduce){.button{transition:none}}
</style>
</head>
<body><main class="wrap"><header><span class="pill">✦ 給選擇困難的你 ✦</span><h1>🎡 選擇困難救星</h1><p>人生已經夠難了，小事就交給轉盤吧！</p></header><div class="layout"><section class="panel wheel-panel"><h2>✨ 命運轉盤</h2><div class="wheel-box"><div class="pointer" aria-hidden="true"></div><canvas id="wheel" width="800" height="800" role="img" aria-label="顯示各選項與其抽中比例的轉盤"></canvas><div class="center" aria-hidden="true">✦</div></div><div class="actions"><button class="button primary" id="spin">🎲 開始轉盤</button><button class="button secondary" id="again">再抽一次 ↻</button></div><div class="result" id="result" aria-live="polite"><span class="muted">準備好了嗎？讓命運幫你選！</span></div></section><div><section class="panel"><h2>📝 我的選項 <span class="muted" id="count"></span></h2><div class="label-row"><span>選項名稱</span><span>權重</span><span></span></div><div id="options"></div><button class="button secondary add" id="add">＋ 新增選項</button><p class="helper">至少 2 個、最多 8 個選項。權重越大，被抽中的機率越高（1～100）。</p><div class="toast" id="notice" role="status"></div></section><section class="panel history"><h2>🕒 最近 10 次紀錄</h2><ul class="history-list" id="history"></ul><button class="button secondary" id="clear" style="margin-top:14px;font-size:13px;padding:9px 13px">清除紀錄</button></section></div></div><div class="foot">Made with ♡ · 所有資料僅儲存在你的瀏覽器</div></main>
<script>
(()=>{'use strict';const KEY='decision-helper-v2',HKEY='decision-helper-history-v2';const colors=['#f7c8d4','#c9d9fa','#fbe3a9','#bce9db','#decdf5','#ffd5bd','#cce6f6','#e9e6ad'];const defaults=[{name:'讀書',weight:1},{name:'追劇',weight:1},{name:'出去玩',weight:1},{name:'吃好吃的',weight:1}];function load(k,f){try{const v=JSON.parse(localStorage.getItem(k));return Array.isArray(v)?v:f}catch{return f}}let options=load(KEY,defaults).filter(x=>x&&typeof x.name==='string'&&Number.isFinite(+x.weight)).slice(0,8);if(options.length<2)options=defaults.map(x=>({...x}));let history=load(HKEY,[]).filter(x=>x&&typeof x.name==='string').slice(0,10);let rotation=0,spinning=false;const $=id=>document.getElementById(id),canvas=$('wheel'),ctx=canvas.getContext('2d');const TAU=Math.PI*2;function save(){try{localStorage.setItem(KEY,JSON.stringify(options));localStorage.setItem(HKEY,JSON.stringify(history))}catch{$('notice').textContent='瀏覽器目前無法儲存資料。'}}function valid(){return options.length>=2&&options.length<=8&&options.every(x=>x.name.trim()&&Number.isInteger(+x.weight)&&+x.weight>=1&&+x.weight<=100)}function arcs(){const total=options.reduce((s,o)=>s+Number(o.weight||1),0);let at=0;return options.map(o=>{const start=at;at+=TAU*Number(o.weight||1)/total;return{start,end:at,name:o.name}})}function draw(){const size=800,r=360,c=400;ctx.clearRect(0,0,size,size);const segments=arcs();ctx.save();ctx.translate(c,c);ctx.rotate(rotation);segments.forEach((seg,i)=>{ctx.beginPath();ctx.moveTo(0,0);ctx.arc(0,0,r,seg.start,seg.end);ctx.closePath();ctx.fillStyle=colors[i];ctx.fill();ctx.lineWidth=5;ctx.strokeStyle='#fff';ctx.stroke();const mid=(seg.start+seg.end)/2,span=seg.end-seg.start;ctx.save();ctx.rotate(mid);ctx.translate(r*.62,0);ctx.rotate(Math.PI/2);ctx.fillStyle='#534e66';ctx.textAlign='center';ctx.textBaseline='middle';const maxChars=span<.5?5:9;let label=seg.name.trim();if([...label].length>maxChars)label=[...label].slice(0,maxChars-1).join('')+'…';ctx.font=`bold ${span<.5?23:29}px system-ui`;ctx.fillText(label,0,0,Math.max(60,r*.62));ctx.restore()});ctx.restore();ctx.beginPath();ctx.arc(c,c,r+7,0,TAU);ctx.lineWidth=12;ctx.strokeStyle='#fff';ctx.stroke()}function renderOptions(){const root=$('options');root.replaceChildren();options.forEach((o,i)=>{const row=document.createElement('div');row.className='option-row';const name=document.createElement('input');name.value=o.name;name.maxLength=30;name.setAttribute('aria-label',`選項 ${i+1} 名稱`);name.disabled=spinning;name.addEventListener('input',()=>{o.name=name.value;save();draw();updateButtons()});const weight=document.createElement('input');weight.type='number';weight.min=1;weight.max=100;weight.step=1;weight.value=o.weight;weight.disabled=spinning;weight.setAttribute('aria-label',`選項 ${i+1} 權重`);weight.addEventListener('input',()=>{o.weight=weight.value;save();if(valid())draw();updateButtons()});const del=document.createElement('button');del.textContent='×';del.title='刪除選項';del.setAttribute('aria-label',`刪除 ${o.name}`);del.disabled=spinning||options.length<=2;del.addEventListener('click',()=>{if(options.length<=2)return;options.splice(i,1);save();renderOptions();draw()});row.append(name,weight,del);root.append(row)});$('count').textContent=`(${options.length}/8)`;updateButtons()}function updateButtons(){$('spin').disabled=spinning||!valid();$('again').disabled=spinning||!valid();$('add').disabled=spinning||options.length>=8;$('clear').disabled=spinning||!history.length;$('notice').textContent=valid()?'': '請填寫 2～8 個不重複也可以的選項，權重需為 1～100 的整數。'}function renderHistory(){const ul=$('history');ul.replaceChildren();if(!history.length){const li=document.createElement('li');li.className='muted';li.textContent='還沒有抽籤紀錄～';ul.append(li)}else history.forEach(h=>{const li=document.createElement('li'),name=document.createElement('span'),date=document.createElement('small');name.textContent='🎯 '+h.name;date.textContent=new Date(h.time).toLocaleString('zh-TW',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});li.append(name,date);ul.append(li)});updateButtons()}function spin(){if(spinning||!valid())return;spinning=true;renderOptions();updateButtons();$('result').innerHTML='<span class="muted">✨ 命運正在思考中…</span>';const segments=arcs(),total=options.reduce((s,o)=>s+Number(o.weight),0);let pick=Math.random()*total,index=0;for(let i=0;i<options.length;i++){pick-=Number(options[i].weight);if(pick<0){index=i;break}}const seg=segments[index],middle=(seg.start+seg.end)/2;const targetNormalized=(((-Math.PI/2-middle)%TAU)+TAU)%TAU;const current=((rotation%TAU)+TAU)%TAU;const delta=((targetNormalized-current)%TAU+TAU)%TAU;const start=rotation,end=start+TAU*6+delta;const begin=performance.now(),duration=4300;function frame(now){const t=Math.min(1,(now-begin)/duration),ease=1-Math.pow(1-t,4);rotation=start+(end-start)*ease;draw();if(t<1){requestAnimationFrame(frame)}else{rotation=end%TAU;draw();spinning=false;const chosen=options[index].name.trim();$('result').replaceChildren();const lead=document.createElement('div');lead.className='muted';lead.textContent='🎉 命運幫你選好了！';const answer=document.createElement('strong');answer.textContent=chosen;$('result').append(lead,answer);history.unshift({name:chosen,time:Date.now()});history=history.slice(0,10);save();renderOptions();renderHistory()}}requestAnimationFrame(frame)}$('spin').addEventListener('click',spin);$('again').addEventListener('click',spin);$('add').addEventListener('click',()=>{if(spinning||options.length>=8)return;options.push({name:'新選項',weight:1});save();renderOptions();draw()});$('clear').addEventListener('click',()=>{if(spinning)return;history=[];save();renderHistory()});renderOptions();renderHistory();draw()})();
</script></body></html>
